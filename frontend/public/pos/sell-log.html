<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECO-THRIFT SELL LOG</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @page {
      size: letter landscape;
      margin: 0.35in 0.4in 0.3in;
    }

    html, body {
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      font-size: 7pt;
      color: #111;
      background: #fff;
    }

    .sheet {
      max-width: 10.5in;
      margin: 0 auto;
    }

    h1 {
      font-size: 12pt;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.12em;
      margin-bottom: 4pt;
      padding-bottom: 4pt;
      border-bottom: 3px solid #2d6a2d;
    }

    .blocks {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .appliance-block {
      border-bottom: 1px solid #999;
      page-break-inside: avoid;
    }

    .row {
      display: grid;
      grid-template-columns:
        0.72in   /* name */
        0.72in   /* phone */
        0.55in   /* date */
        0.55in   /* price or address start */
        1.35in   /* claim or address cont */
        0.35in   /* apt */
        0.42in   /* unit */
        0.72in   /* credit or fee */
        0.28in;  /* done */
      align-items: stretch;
      min-height: 14pt;
    }

    .row-warranty {
      background: #fff;
      grid-template-columns:
        0.72in
        0.72in
        0.55in
        0.55in
        2.12in   /* claim reason wide */
        0.72in;  /* credit */
    }

    .row-delivery {
      background: #e8e8e8;
    }

    .cell {
      border-right: 1px solid #bbb;
      border-top: 1px solid #bbb;
      padding: 1pt 3pt 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow: hidden;
    }

    .cell:first-child {
      border-left: 1px solid #bbb;
    }

    .label {
      font-size: 5.5pt;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: #444;
      line-height: 1;
      margin-bottom: 1pt;
    }

    .field {
      flex: 1;
      min-height: 10pt;
    }

    .cell-fee .field,
    .cell-done .field {
      display: flex;
      align-items: center;
      gap: 4pt;
      font-size: 6.5pt;
    }

    .cell-fee .field span {
      white-space: nowrap;
    }

    .circle {
      display: inline-block;
      width: 7pt;
      height: 7pt;
      border: 1px solid #333;
      border-radius: 50%;
      vertical-align: middle;
    }

    .checkbox {
      display: inline-block;
      width: 8pt;
      height: 8pt;
      border: 1px solid #333;
      vertical-align: middle;
    }

    .cell-done .checkbox {
      width: 7pt;
      height: 7pt;
    }

    @media screen {
      body { padding: 12px; background: #eee; }
      .sheet {
        background: #fff;
        padding: 0.35in 0.4in 0.3in;
        box-shadow: 0 1px 6px rgba(0,0,0,0.12);
      }
    }

    @media print {
      body { background: #fff; }
      .sheet { max-width: none; margin: 0; }
    }
  </style>
</head>
<body>
  <div class="sheet">
    <h1>ECO-THRIFT SELL LOG</h1>
    <div class="blocks" id="blocks"></div>
  </div>

  <script>
    const APPLIANCE_COUNT = 50;

    const blocksEl = document.getElementById('blocks');

    for (let i = 0; i < APPLIANCE_COUNT; i++) {
      const block = document.createElement('div');
      block.className = 'appliance-block';
      block.innerHTML = `
        <div class="row row-warranty">
          <div class="cell"><span class="label">Name</span><div class="field"></div></div>
          <div class="cell"><span class="label">Phone</span><div class="field"></div></div>
          <div class="cell"><span class="label">Date</span><div class="field"></div></div>
          <div class="cell"><span class="label">Purchase Price $</span><div class="field"></div></div>
          <div class="cell"><span class="label">Claim Reason</span><div class="field"></div></div>
          <div class="cell"><span class="label">Credit Amount $</span><div class="field"></div></div>
        </div>
        <div class="row row-delivery">
          <div class="cell"><span class="label">Name</span><div class="field"></div></div>
          <div class="cell"><span class="label">Phone</span><div class="field"></div></div>
          <div class="cell"><span class="label">Date</span><div class="field"></div></div>
          <div class="cell" style="grid-column: span 2;"><span class="label">Address</span><div class="field"></div></div>
          <div class="cell cell-apt"><span class="label">Apt?</span><div class="field"><span class="checkbox"></span></div></div>
          <div class="cell"><span class="label">Unit #</span><div class="field"></div></div>
          <div class="cell cell-fee"><span class="label">Fee</span><div class="field"><span class="circle"></span> $50 &nbsp; <span class="circle"></span> $75</div></div>
          <div class="cell cell-done"><span class="label">Done</span><div class="field"><span class="checkbox"></span></div></div>
        </div>
      `;
      blocksEl.appendChild(block);
    }
  </script>
</body>
</html>
